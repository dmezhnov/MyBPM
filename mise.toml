[tools]
bun = "1.4.2"

[tasks.skills-check]
description = "Check that every heading a SKILL.md routes to still exists in its document"
shell = "bun -e"
run = '''
const skills = [["mybpm-imports", "MYBPM-IMPORTS.md"], ["mybpm-stand", "MYBPM-UI-API.md"]];
let bad = 0;
for (const [name, doc] of skills) {
  const skill = await Bun.file(`skills/${name}/SKILL.md`).text();
  const lines = (await Bun.file(doc).text()).split("\n");
  const anchors = [...skill.matchAll(/`(#+ [^`]+)`/g)].map((m) => m[1]);
  for (const a of anchors) {
    if (!lines.some((l) => l.startsWith(a))) { console.error(`${name}: no heading "${a}" in ${doc}`); bad++; }
  }
  console.log(`${name}: ${anchors.length} anchors checked`);
}
if (bad) process.exit(1);
'''

[tasks.skills-zip]
description = "Pack each skill with its document into dist/skills/<name>.zip for upload to claude.ai"
shell = "bun -e"
run = '''
import { $ } from "bun";
import { zip } from "./tools/zip.ts";
await $`mise run skills-check`;
const skills = [["mybpm-imports", "MYBPM-IMPORTS.md"], ["mybpm-stand", "MYBPM-UI-API.md"]];
await $`rm -rf dist/skills`;
for (const [name, doc] of skills) {
  const entries = [];
  for (const [inZip, src] of [[`${name}/SKILL.md`, `skills/${name}/SKILL.md`], [`${name}/${doc}`, doc]])
    entries.push({ name: inZip, data: await Bun.file(src).bytes() });
  await Bun.write(`dist/skills/${name}.zip`, zip(entries));
  console.log(`dist/skills/${name}.zip`);
}
'''

[tasks.test]
description = "Everything CI runs before a release: skill anchors, every tool parses, the skill zips build and hold SKILL.md + the document"
shell = "bun -e"
run = '''
import { $ } from "bun";
import { unzip } from "./tools/zip.ts";
await $`mise run skills-check`;
for (const f of new Bun.Glob("tools/*.ts").scanSync()) await $`bun build --target=bun --no-bundle ${f}`.quiet();
await $`mise run skills-zip`;
for (const [name, doc] of [["mybpm-imports", "MYBPM-IMPORTS.md"], ["mybpm-stand", "MYBPM-UI-API.md"]]) {
  const list = unzip(await Bun.file(`dist/skills/${name}.zip`).bytes()).map((e) => e.name);
  for (const want of [`${name}/SKILL.md`, `${name}/${doc}`]) {
    if (!list.includes(want)) { console.error(`dist/skills/${name}.zip: no ${want}`); process.exit(1); }
  }
}
console.log("all tests passed");
'''

[tasks.publish]
description = "Set the plugin version, commit everything, push to test and stream the CI run (mise test -> fast-forward main -> GitHub release with the skill zips), then fetch origin and update the installed mybpm plugin"
usage = '''
arg "<version>" help="New plugin version for .claude-plugin/plugin.json, e.g. 1.2.0; the release tag is v<version>"
arg "<message>" help="Commit message for the release commit"
'''
shell = "bun -e"
run = '''
import { $ } from "bun";
const version = Bun.env.usage_version ?? "", message = Bun.env.usage_message ?? "";
if (!/^\d+\.\d+\.\d+$/.test(version)) { console.error(`version must look like 1.2.0, got "${version}"`); process.exit(1); }
if ((await $`git ls-remote --tags origin refs/tags/v${version}`.text()).trim()) {
  console.error(`tag v${version} already exists on origin; pick a new version`); process.exit(1);
}
// The same checks CI runs: a failure here costs seconds, not a CI round trip.
await $`mise test`;

const pluginFile = ".claude-plugin/plugin.json";
const plugin = await Bun.file(pluginFile).json();
plugin.version = version;
await Bun.write(pluginFile, JSON.stringify(plugin, null, 2) + "\n");
await $`git add -A`;
await $`git commit -m ${message}`;
await $`git push origin HEAD:test --force-with-lease`;

// Match the run by the pushed SHA, not "latest"; it takes a few seconds to register.
const sha = (await $`git rev-parse HEAD`.text()).trim();
let runId = "";
for (let i = 0; i < 10 && !runId; i++) {
  await Bun.sleep(3000);
  const runs = await $`gh run list --branch test --limit 10 --json databaseId,headSha`.json();
  runId = String(runs.find((r) => r.headSha === sha)?.databaseId ?? "");
}
if (!runId) { console.error("Publish run not found yet; check GitHub Actions manually."); process.exit(0); }
const watch = await $`gh run watch ${runId} --exit-status`.nothrow();
if (watch.exitCode) process.exit(watch.exitCode);

// CI fast-forwarded main on the remote; refresh origin/main so local main no longer shows "ahead 1".
await $`git fetch origin`;

// main now holds the release: pull it into the locally installed plugin so the new skills are live
// after the next Claude Code restart.
await $`claude plugin marketplace update mybpm`;
await $`claude plugin update mybpm@mybpm`;
'''

[tasks.bridge]
description = "Start the 127.0.0.1:8787 page<->disk bridge detached (GET /get?name= feeds tools/out/bridge/<name> into a page, POST /save?name= writes it)"
shell = "bun -e"
run = '''
const pidFile = "tools/out/bridge/bridge.pid";
if (await Bun.file(pidFile).exists()) {
  const pid = Number(await Bun.file(pidFile).text());
  try { process.kill(pid, 0); console.log(`bridge already running, pid ${pid}`); process.exit(0); } catch {}
}
const child = Bun.spawn(["setsid", "bun", "tools/bridge.bun.ts"], {
  stdin: "ignore", stdout: Bun.file("tools/out/bridge/bridge.log"), stderr: Bun.file("tools/out/bridge/bridge.log"),
});
child.unref();
await Bun.sleep(500);
console.log(`bridge started on 127.0.0.1:8787 (dir tools/out/bridge/)`);
'''

[tasks.bridge-stop]
description = "Stop the bridge started by `mise run bridge` (by its pid file)"
shell = "bun -e"
run = '''
const pidFile = Bun.file("tools/out/bridge/bridge.pid");
if (!(await pidFile.exists())) { console.log("no bridge pid file"); process.exit(0); }
try { process.kill(Number(await pidFile.text())); console.log("bridge stopped"); } catch { console.log("bridge was not running"); }
await pidFile.delete();
'''
