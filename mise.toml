  ["bo_find", { code: "Lint_dict", stand: "Локальный" }, (r) => /has expired.*stand_account_save/.test(r)],
  ["stand_account_save", { stand: env.MYBPM_STAND, login: "u3@mock", password: "secret", was: "Локальный" }, (r) => r.remembered === true && r.name === "Локальный"],
  ["stand_call", { stand: "Локальный", path: "v2/auth/logout", get: true }, () => true],
  ["bo_find", { code: "Lint_dict", stand: "Локальный" }, (r) => r.exists === false],
  ["stand_remove", { stand: "Локальный" }, (r) => /Локальный/.test(r.removed)],
  ["stand_list", {}, (r) => r.accounts.length === 1 && r.accounts[0].email === "admin@mock"],
  ["bo_find", { code: "Lint_dict" }, (r) => r.exists === false],
];
let bad = 0;
try {
  for (const rt of ["node", "bun"].filter((r) => Bun.which(r))) {
    const args = steps.flatMap(([t, a]) => [t, JSON.stringify(a)]);
    const r = await $`bun tools/mcp-client.bun.ts call ${args} --runtime ${rt} --json`.env(env).nothrow().quiet();
    const report = JSON.parse(r.stdout.toString() || "[]");
    steps.forEach(([t, , ok], i) => {
      const got = report[i];
      let pass = false;
      try { pass = !!got && (got.isError ? /refused|not a read method|не принял|several accounts|taken|not a field|names the user|update the plugin|DROPDOWN_SINGLE|not a registry column|is a key of|stand keeps it|no figure|no slot|forward needs arrowId|no group «|has no action|not a sidebar icon|not an option|not a participant|conflicts still open|has expired|local stands only/.test(JSON.stringify(got.result)) : true) && ok(got.result); } catch {}
      if (!pass) { bad++; console.error(`mcp (${rt}) step ${i + 1} ${t}: ${JSON.stringify(got?.result)?.slice(0, 300)}`); }
    });
    // the mock says 99.0.0 is out: the first answer and every stand_list carry the note, the others do not
    const noted = report.map((x: any, i: number) => !!x.notes?.some((n: string) => /^> ⚠️ \*\*A new version of the MyBPM plugin is out: 99\.0\.0\*\*/m.test(n)) === (i === 0 || steps[i][0] === "stand_list"));
    if (noted.includes(false)) { bad++; console.error(`mcp (${rt}): the release note sits on the wrong steps: ${noted.map((ok: boolean, i: number) => ok ? "" : i + 1).filter(Boolean)}`); }
    // a removed account takes its remembered password along
    const kept = await Bun.file(env.MYBPM_SECRETS_FILE).json().catch(() => ({}));
    if (Object.keys(kept).length) { bad++; console.error(`mcp (${rt}): remembered passwords left after stand_remove: ${Object.keys(kept)}`); }
    if (report.length !== steps.length) { bad++; console.error(`mcp (${rt}): ${report.length}/${steps.length} steps answered\n${r.stderr}`); }
    // on the latest copy (no release check) the report is a prefilled issue form of the repository
    const rep = await $`bun tools/mcp-client.bun.ts call platform_report ${JSON.stringify({ title: "Поле не сохраняется", document: "MYBPM-UI-API.md", heading: "R1 step 7", mark: "[C]", docSays: "x", standDid: "y" })} --runtime ${rt} --json`
      .env({ ...env, MYBPM_LATEST_URL: "" }).nothrow().quiet();
    const issue = JSON.parse(rep.stdout.toString() || "[]")[0]?.result;
    const q = issue?.url && new URL(issue.url).searchParams;
    if (!q || !issue.url.startsWith("https://github.com/dmezhnov/MyBPM/issues/new?") || q.get("template") !== "platform-discrepancy.yml"
      || q.get("title") !== "Поле не сохраняется" || q.get("mark") !== "[C]" || !q.get("version") || issue.opened !== false || !/label%3Aplatform-discrepancy/.test(issue.search)) {
      bad++; console.error(`mcp (${rt}) platform_report: ${JSON.stringify(issue)?.slice(0, 400)}\n${rep.stderr}`);
    }
  }
  // the same tools as a terminal command (mise run stand): flags coerced by the schema, a JSON word, help, errors with exit 1
  for (const [rt, server] of [["bun", "mcp/mybpm-stand.ts"], ["node", "mcp/mybpm-stand.cjs"]].filter(([r]) => Bun.which(r))) {
    const run = (...a: string[]) => $`${rt} ${server} ${a}`.env(env).nothrow().quiet();
    const checks: [string[], (r: any) => boolean][] = [
      [["list"], (r) => r.exitCode === 0 && /^bo_delete +✎ /m.test(r.stdout.toString())],
      [["bo_read", "help"], (r) => r.exitCode === 0 && /--bo-id <string>/.test(r.stdout.toString())],
      [["bo_find", "--code", "Lint_dict"], (r) => r.exitCode === 0 && JSON.parse(r.stdout.toString()).exists === false],
      [["bo_find", JSON.stringify({ code: "Lint_dict" })], (r) => r.exitCode === 0 && JSON.parse(r.stdout.toString()).exists === false],
      [["bo_find", "--cod", "x"], (r) => r.exitCode === 1 && /no argument --cod/.test(r.stderr.toString())],
      [["stand_remove"], (r) => r.exitCode === 1 && /missing --stand/.test(r.stderr.toString())],
      [["no_such_tool"], (r) => r.exitCode === 2],
    ];
    for (const [a, ok] of checks) {
      const r = await run(...a);
      if (!ok(r)) { bad++; console.error(`cli (${rt}) ${a.join(" ")}: exit ${r.exitCode}\n${r.stdout.toString().slice(0, 300)}${r.stderr.toString().slice(0, 300)}`); }
    }
  }
} finally { mock.kill(); }
if (bad) process.exit(1);
// the Desktop extension packs, and its server finds the lint and its version where the .mcpb puts them
await $`mise run mcp-pack`.quiet();
await $`rm -rf dist/mcp-test/mcpb && mkdir -p dist/mcp-test/mcpb && unzip -q dist/mcp/mybpm-stand.mcpb -d dist/mcp-test/mcpb`.quiet();
const packed = await $`bun tools/mcp-client.bun.ts call archive_lint ${JSON.stringify({ path: zipFile })} --server dist/mcp-test/mcpb/server/mybpm-stand.cjs --json`.env(env).nothrow().quiet();
const lintRow = JSON.parse(packed.stdout.toString() || "[]")[0];
if (lintRow?.result?.lint !== "form lint: OK") { console.error(`.mcpb server: archive_lint answered ${JSON.stringify(lintRow)}\n${packed.stderr}`); process.exit(1); }
// the uploadable plugin zip: one top folder, a valid manifest, each skill with its document, and its server finds the lint
await $`mise run plugin-zip`.quiet();
await $`rm -rf dist/mcp-test/plugin && mkdir -p dist/mcp-test/plugin && unzip -q dist/plugin/mybpm-plugin.zip -d dist/mcp-test/plugin`.quiet();
for (const want of ["mybpm/.claude-plugin/plugin.json", "mybpm/mcp/mybpm-stand.cjs", "mybpm/skills/mybpm-imports/SKILL.md", "mybpm/skills/mybpm-imports/MYBPM-IMPORTS.md",
  "mybpm/skills/mybpm-imports/scripts/lint-archive.cjs", "mybpm/skills/mybpm-stand/SKILL.md", "mybpm/skills/mybpm-stand/MYBPM-UI-API.md"]) {
  if (!(await Bun.file(`dist/mcp-test/plugin/${want}`).exists())) { console.error(`dist/plugin/mybpm-plugin.zip: no ${want}`); process.exit(1); }
}
if ((await $`ls -A dist/mcp-test/plugin`.text()).trim() !== "mybpm") { console.error("dist/plugin/mybpm-plugin.zip: more than one top-level entry"); process.exit(1); }
if ((await $`which claude`.nothrow().quiet()).exitCode === 0) await $`claude plugin validate dist/mcp-test/plugin/mybpm`.quiet();
const fromZip = await $`bun tools/mcp-client.bun.ts call archive_lint ${JSON.stringify({ path: zipFile })} --server dist/mcp-test/plugin/mybpm/mcp/mybpm-stand.cjs --json`.env(env).nothrow().quiet();
const zipRow = JSON.parse(fromZip.stdout.toString() || "[]")[0];
if (zipRow?.result?.lint !== "form lint: OK") { console.error(`plugin zip server: archive_lint answered ${JSON.stringify(zipRow)}\n${fromZip.stderr}`); process.exit(1); }
console.log("all tests passed");
'''

[tasks.publish]
description = "Set the plugin version, commit everything, push to test and stream the CI run (mise test -> fast-forward main -> GitHub release with the skill zips), then fetch origin and update the installed mybpm plugin"
usage = '''
arg "<version>" help="New plugin version for .claude-plugin/plugin.json, e.g. 1.2.0; the release tag is v<version>"
arg "<message>" help="Commit message for the release commit"
'''
shell = "bun -e"
run = '''
import { $ } from "bun";
const version = Bun.env.usage_version ?? "", message = Bun.env.usage_message ?? "";
if (!/^\d+\.\d+\.\d+$/.test(version)) { console.error(`version must look like 1.2.0, got "${version}"`); process.exit(1); }
if ((await $`git ls-remote --tags origin refs/tags/v${version}`.text()).trim()) {
  console.error(`tag v${version} already exists on origin; pick a new version`); process.exit(1);
}
// The same checks CI runs: a failure here costs seconds, not a CI round trip.
await $`mise test`;

const pluginFile = ".claude-plugin/plugin.json";
const plugin = await Bun.file(pluginFile).json();
plugin.version = version;
await Bun.write(pluginFile, JSON.stringify(plugin, null, 2) + "\n");
for (const skill of ["skills/mybpm-imports/SKILL.md", "skills/mybpm-stand/SKILL.md"]) {
  const text = await Bun.file(skill).text();
  await Bun.write(skill, text.replace(/(This copy of the skill is version \*\*)[\d.]+(\*\*)/, (_, a, b) => a + version + b));
}
await $`git add -A`;
await $`git commit -m ${message}`;
await $`git push origin HEAD:test --force-with-lease`;

// Match the run by the pushed SHA, not "latest"; it takes a few seconds to register.
const sha = (await $`git rev-parse HEAD`.text()).trim();
let runId = "";
for (let i = 0; i < 10 && !runId; i++) {
  await Bun.sleep(3000);
  const runs = await $`gh run list --branch test --limit 10 --json databaseId,headSha`.json();
  runId = String(runs.find((r) => r.headSha === sha)?.databaseId ?? "");
}
if (!runId) { console.error("Publish run not found yet; check GitHub Actions manually."); process.exit(0); }
const watch = await $`gh run watch ${runId} --exit-status`.nothrow();
if (watch.exitCode) process.exit(watch.exitCode);

// CI fast-forwarded main on the remote; refresh origin/main so local main no longer shows "ahead 1".
await $`git fetch origin`;

// main now holds the release: pull it into the locally installed plugin so the new skills are live
// after the next Claude Code restart.
await $`claude plugin marketplace update mybpm`;
await $`claude plugin update mybpm@mybpm`;
'''

[tasks.bridge]
