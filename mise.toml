[tools]
bun = "1.4.2"

[tasks.skills-check]
description = "Check that every heading a SKILL.md routes to still exists in its document"
shell = "bun -e"
run = '''
const skills = [["mybpm-imports", "MYBPM-IMPORTS.md"], ["mybpm-stand", "MYBPM-UI-API.md"]];
let bad = 0;
for (const [name, doc] of skills) {
  const skill = await Bun.file(`skills/${name}/SKILL.md`).text();
  const lines = (await Bun.file(doc).text()).split("\n");
  const anchors = [...skill.matchAll(/`(#+ [^`]+)`/g)].map((m) => m[1]);
  for (const a of anchors) {
    if (!lines.some((l) => l.startsWith(a))) { console.error(`${name}: no heading "${a}" in ${doc}`); bad++; }
  }
  console.log(`${name}: ${anchors.length} anchors checked`);
}
if (bad) process.exit(1);
'''

[tasks.skills-gen]
description = "Generate the scripts a skill ships: skills/mybpm-imports/scripts/lint-archive.cjs = the lintArchive block of MYBPM-IMPORTS.md 0.10 inside the wrapper tools/lint-archive-cli.js"
shell = "bun -e"
run = '''
const lint = (await Bun.file("MYBPM-IMPORTS.md").text()).match(/```js\n(function lintArchive[\s\S]*?\n)```/)?.[1];
if (!lint) { console.error("MYBPM-IMPORTS.md: no lintArchive block"); process.exit(1); }
const tpl = await Bun.file("tools/lint-archive-cli.js").text();
const head = "// GENERATED by `mise run skills-gen` from MYBPM-IMPORTS.md 0.10 (lintArchive) and tools/lint-archive-cli.js — do not edit.\n" +
  "// Run: node lint-archive.cjs <archive.mybpm.zip> [MYBPM-IMPORTS.md]   (Node >= 18 or Bun; exit 1 while a defect line is left)";
const body = tpl.slice(tpl.indexOf("//@@HEADER@@")).replace("//@@HEADER@@", () => head).replace("//@@LINT_ARCHIVE@@\n", () => lint);
await Bun.write("skills/mybpm-imports/scripts/lint-archive.cjs", body);
console.log("skills/mybpm-imports/scripts/lint-archive.cjs");
'''

[tasks.mcp-build]
description = "Bundle the mybpm-stand MCP server mcp/mybpm-stand.ts into one CommonJS file mcp/mybpm-stand.cjs (runs under Node >= 18 and Bun; committed — the plugin starts it from the repository)"
shell = "bun -e"
run = '''
import { $ } from "bun";
await $`bun build mcp/mybpm-stand.ts --target=node --format=cjs --outfile mcp/mybpm-stand.cjs`.quiet();
const out = await Bun.file("mcp/mybpm-stand.cjs").text();
await Bun.write("mcp/mybpm-stand.cjs", "// GENERATED by `mise run mcp-build` from mcp/mybpm-stand.ts — do not edit.\n" + out);
console.log("mcp/mybpm-stand.cjs");
'''

[tasks.mcp-pack]
description = "Pack the mybpm-stand MCP server as a Claude Desktop extension dist/mcp/mybpm-stand.mcpb: manifest.json (version of plugin.json; no settings — stand accounts are added on the server's own accounts page, tool stand_accounts), server/mybpm-stand.cjs, the skill lint and MYBPM-IMPORTS.md it reads"
shell = "bun -e"
run = '''
import { $ } from "bun";
import { zip } from "./tools/zip.ts";
await $`mise run mcp-build`.quiet();
await $`mise run skills-gen`.quiet();
const plugin = await Bun.file(".claude-plugin/plugin.json").json();
const manifest = {
  manifest_version: "0.3", name: "mybpm-stand", display_name: "MyBPM stand", version: plugin.version,
  description: "Drive a running MyBPM stand: accounts, BO structure, build BOs and composites in the constructor, import a .mybpm.zip (lint, analyze, apply, rollback), export structure, the bell, any API method; report a discrepancy with the docs as a GitHub issue.",
  author: plugin.author, repository: { type: "git", url: plugin.repository },
  server: { type: "node", entry_point: "server/mybpm-stand.cjs", mcp_config: { command: "node", args: ["${__dirname}/server/mybpm-stand.cjs"] } },
  compatibility: { platforms: ["darwin", "win32", "linux"], runtimes: { node: ">=18" } },
};
const files = [["server/mybpm-stand.cjs", "mcp/mybpm-stand.cjs"], ["skills/mybpm-imports/scripts/lint-archive.cjs", "skills/mybpm-imports/scripts/lint-archive.cjs"], ["MYBPM-IMPORTS.md", "MYBPM-IMPORTS.md"]];
const entries = [{ name: "manifest.json", data: new TextEncoder().encode(JSON.stringify(manifest, null, 2) + "\n") }];
for (const [inZip, src] of files) entries.push({ name: inZip, data: await Bun.file(src).bytes() });
await $`rm -rf dist/mcp`;
await Bun.write("dist/mcp/mybpm-stand.mcpb", zip(entries));
console.log("dist/mcp/mybpm-stand.mcpb");
'''

[tasks.plugin-zip]
description = "Pack the whole plugin for Customize → Plugins → Add → Upload plugin (claude.ai, Claude Desktop) into dist/plugin/mybpm-plugin.zip: one top folder mybpm/ with .claude-plugin/plugin.json, both skills (each with its document beside SKILL.md, the lint script) and mcp/mybpm-stand.cjs"
shell = "bun -e"
run = '''
import { $ } from "bun";
import { zip } from "./tools/zip.ts";
await $`mise run skills-check`.quiet();
await $`mise run skills-gen`.quiet();
await $`mise run mcp-build`.quiet();
// plugin.json only: marketplace.json describes the repository, not the plugin
const files = [[".claude-plugin/plugin.json", ".claude-plugin/plugin.json"], ["mcp/mybpm-stand.cjs", "mcp/mybpm-stand.cjs"]];
for (const [name, doc] of [["mybpm-imports", "MYBPM-IMPORTS.md"], ["mybpm-stand", "MYBPM-UI-API.md"]]) {
  for (const p of [...new Bun.Glob("**/*").scanSync(`skills/${name}`)].sort()) files.push([`skills/${name}/${p}`, `skills/${name}/${p}`]);
  files.push([`skills/${name}/${doc}`, doc]);
}
const entries = [];
for (const [inZip, src] of files) entries.push({ name: `mybpm/${inZip}`, data: await Bun.file(src).bytes() });
await $`rm -rf dist/plugin`;
await Bun.write("dist/plugin/mybpm-plugin.zip", zip(entries));
console.log("dist/plugin/mybpm-plugin.zip");
'''

[tasks.skills-zip]
description = "Pack each skill (every file under skills/<name>/, scripts regenerated) with its document into dist/skills/<name>.zip for upload to claude.ai"
shell = "bun -e"
run = '''
import { $ } from "bun";
import { zip } from "./tools/zip.ts";
await $`mise run skills-check`;
await $`mise run skills-gen`;
const skills = [["mybpm-imports", "MYBPM-IMPORTS.md"], ["mybpm-stand", "MYBPM-UI-API.md"]];
await $`rm -rf dist/skills`;
for (const [name, doc] of skills) {
  const files = [...new Bun.Glob("**/*").scanSync(`skills/${name}`)].sort().map((p) => [`${name}/${p}`, `skills/${name}/${p}`]);
  const entries = [];
  for (const [inZip, src] of [...files, [`${name}/${doc}`, doc]])
    entries.push({ name: inZip, data: await Bun.file(src).bytes() });
  await Bun.write(`dist/skills/${name}.zip`, zip(entries));
  console.log(`dist/skills/${name}.zip`);
}
'''

[tasks.test]
description = "Everything CI runs before a release: skill anchors, every tool parses, the skill zips build and hold SKILL.md + the document (+ scripts/lint-archive.cjs), the generated lint is committed in sync with IMPORTS 0.10 and runs clean on a generated dictionary under node and bun; the MCP server mcp/mybpm-stand.cjs is built in sync and runs the import/export/bell cycle, the constructor, the rights (BO, field, tab, menu item), the records (both save cycles, a veto, the ES breaker, find, read, delete), the records xlsx (template, import act, cancel, apply, export, update by path) and the accounts (page login, wrong password, no default with two, a dead session renewed by the remembered password, rename, stand_account_save on a local stand only, remove) against the mock stand under node and bun, plus the same tools as a terminal command (mise run stand)"
shell = "bun -e"
run = '''
import { $ } from "bun";
import { unzip } from "./tools/zip.ts";
await $`mise run skills-check`;
// each SKILL.md names the plugin version it ships with (mise publish writes both) — its own release check compares that
const pluginVersion = (await Bun.file(".claude-plugin/plugin.json").json()).version;
for (const skill of ["skills/mybpm-imports/SKILL.md", "skills/mybpm-stand/SKILL.md"]) {
  const v = (await Bun.file(skill).text()).match(/This copy of the skill is version \*\*([\d.]+)\*\*/)?.[1];
  if (v !== pluginVersion) { console.error(`${skill}: version ${v} ≠ plugin.json ${pluginVersion}`); process.exit(1); }
}
for (const f of new Bun.Glob("tools/*.ts").scanSync()) await $`bun build --target=bun --no-bundle ${f}`.quiet();
await $`mise run skills-zip`;
for (const [name, doc] of [["mybpm-imports", "MYBPM-IMPORTS.md"], ["mybpm-stand", "MYBPM-UI-API.md"]]) {
  const list = unzip(await Bun.file(`dist/skills/${name}.zip`).bytes()).map((e) => e.name);
  for (const want of [`${name}/SKILL.md`, `${name}/${doc}`, ...(name === "mybpm-imports" ? [`${name}/scripts/lint-archive.cjs`] : [])]) {
    if (!list.includes(want)) { console.error(`dist/skills/${name}.zip: no ${want}`); process.exit(1); }
  }
}
// CI checks out what was committed: the generated lint must already match IMPORTS 0.10 there (mise publish commits it)
if (Bun.env.CI && (await $`git status --porcelain -- skills/`.text()).trim()) {
  console.error("skills/ is stale against MYBPM-IMPORTS.md — run mise run skills-gen and commit"); process.exit(1);
}
// the shipped lint (IMPORTS 0.10 lintArchive + wrapper) runs on a generated dictionary under every runtime at hand and stays silent (no false positives)
await $`rm -rf dist/lint-test && bun tools/make-probe-archive.bun.ts --group-code Lint_group --group-name Lint --group-order 1 --code Lint_dict --name Lint --category BO_DICTIONARY --salt lint --bo-order 1 --out dist/lint-test`.quiet();
const zipFile = [...new Bun.Glob("dist/lint-test/*.zip").scanSync()][0];
for (const rt of ["node", "bun"].filter((r) => Bun.which(r))) {
  const r = await $`${rt} skills/mybpm-imports/scripts/lint-archive.cjs ${zipFile}`.nothrow().quiet();
  const defects = r.stdout.toString().split("\n").filter((l) => l && l !== "form lint: OK" && !l.startsWith("REMINDER"));
  if (r.exitCode || defects.length) { console.error(`lint-archive.cjs (${rt}) on a generated dictionary, exit ${r.exitCode}:\n${defects.join("\n")}${r.stderr}`); process.exit(1); }
}
// the MCP server is built in sync with its source and runs the v1 cycle against the mock stand under every runtime at hand
await $`mise run mcp-build`.quiet();
if (Bun.env.CI && (await $`git status --porcelain -- mcp/`.text()).trim()) {
  console.error("mcp/mybpm-stand.cjs is stale against mcp/mybpm-stand.ts — run mise run mcp-build and commit"); process.exit(1);
}
// a bundle that names the build folder would look for its lint and version on the build machine
if ((await Bun.file("mcp/mybpm-stand.cjs").text()).includes(process.cwd())) { console.error("mcp/mybpm-stand.cjs holds the build path — use HERE, not __dirname"); process.exit(1); }
// the accounts page's script lives in a TS template literal, where an escape like \/ silently changes the served JS
const { PAGE_HTML } = await import("./mcp/accounts-page.ts");
try { new Function(PAGE_HTML.match(/<script>([\s\S]*)<\/script>/)![1]); } catch (e) { console.error(`mcp/accounts-page.ts: the page script does not parse — ${e}`); process.exit(1); }
const lines = new TextDecoder().decode(unzip(await Bun.file(zipFile).bytes()).find((e) => e.name.endsWith("/0000001.mybpm"))!.data);
const port = 18000 + Math.floor(Math.random() * 1000);
await $`rm -rf dist/mcp-test && mkdir -p dist/mcp-test/home`.quiet();
const mock = Bun.spawn(["bun", "tools/mock-stand.bun.ts", "dist/mcp-test/requests.jsonl"], { env: { ...Bun.env, PORT: String(port), MOCK_MCP: "1" }, stdout: "ignore" });
await Bun.sleep(500);
const env = { ...Bun.env, HOME: `${process.cwd()}/dist/mcp-test/home`, MYBPM_STAND: `http://127.0.0.1:${port}`, MYBPM_TOKEN: "mock-token", MYBPM_LOGIN: "admin@mock",
  MYBPM_LATEST_URL: `http://127.0.0.1:${port}/latest/plugin.json`, MYBPM_ES_WAIT_MS: "2000", MYBPM_SECRETS_FILE: `${process.cwd()}/dist/mcp-test/secrets.json` };
const page = (body: unknown) => ({ url: "@stand_accounts.url", path: "api/save", body });
const u2 = { stand: env.MYBPM_STAND, login: "u2@mock" };
const steps: [string, unknown, (r: any) => boolean][] = [
  ["stand_list", {}, (r) => r.accounts.length === 1 && r.accounts[0].alive && r.accounts[0].companyCode === "MOCK" && r.accounts[0].personBoId === "PERSONBO00000001"],
  ["bo_find", { code: "Lint_dict" }, (r) => r.exists === false],
  ["archive_put", { name: "lint", part: 1, lines }, (r) => r.linesSoFar > 0],
  ["archive_put", { name: "lint", part: 2, lines: "", last: true }, (r) => r.lint === "form lint: OK" && r.bos[0].code === "Lint_dict"],
  ["import_analyze", { name: "lint" }, (r) => r.status === "ANALYZED" && r.bos.length === 1],
  ["import_apply", { importId: "@import_analyze.importId", description: "mcp test" }, (r) => r.status === "APPLIED" && r.log.canRollback],
  ["bo_find", { code: "Lint_dict" }, (r) => r.exists === true],
  ["structure_export", { codes: ["Lint_dict"], out: "dist/mcp-test/export" }, (r) => r.bos[0].code === "Lint_dict"],
  ["import_rollback", { importId: "@import_analyze.importId" }, (r) => r.preview.canRollback && !r.result],
  ["import_rollback", { importId: "@import_analyze.importId", confirm: true }, (r) => r.log.status === "ROLLED_BACK"],
  ["bo_find", { code: "Lint_dict" }, (r) => r.exists === false],
  ["notifications_read", {}, (r) => r.items.filter((n: any) => n.newThisSession).length === 1 && r.items.length === 2],
  ["notifications_clear", { ids: ["@notifications_read.items.0.id"] }, (r) => r.count.notifications === 1],
  ["stand_read", { path: "import-structure/cancel-import" }, (r) => /not a read method/.test(r)],
  ["stand_call", { path: "v2/auth/v3/login" }, (r) => /refused/.test(r)],
  // the constructor: a BO with a pair row, a dropdown and two fields on a tab; edit + delete + add; codes; a composite; the delete
  ["bo_create", { group: "Бизнес-объект", name: "MCP probe client", code: "mcp_probe_client", fields: [
    { label: "Наименование", type: "INPUT_TEXT", code: "name", required: true }, { label: "Телефон", type: "INPUT_TEXT", code: "phone", cols: 8 },
    { label: "E-mail", type: "INPUT_TEXT", code: "email", cols: 7 }, { label: "Статус", type: "DROPDOWN_SINGLE", code: "status", options: ["Новый", "В работе"] },
    { label: "Заметки", type: "TEXTAREA", code: "notes", tab: "Детали" }, { label: "Открыть", type: "BUTTON", code: "btn_open", url: "https://example.com", tab: "Детали" }] },
    (r) => r.code === "mcp_probe_client" && r.name === "MCP probe client" && r.fields.length === 7 && r.window.w === 12 && r.window.h === 26
      && r.fields[0].column === 0 && r.fields[0].required && r.fields[1].grid === "0/3/8/3" && r.fields[2].grid === "8/3/7/3"
      && r.fields[4].type === "TAB_GROUP" && r.fields[4].code === "tabs" && r.fields[4].grid === "0/9/15/12"
      && r.fields[5].tabId && r.fields[5].grid === "0/0/15/6" && r.fields[6].code === "btn_open" && r.fields[6].grid === "0/6/15/3"],
  ["bo_fields_save", { code: "mcp_probe_client", edit: [{ fieldId: "@bo_create.fields.1.fieldId", label: "Мобильный" }], delete: ["@bo_create.fields.3.fieldId"],
    add: [{ label: "Комментарий", type: "INPUT_TEXT", code: "comment" }], window: false },
    (r) => r.fields.length === 7 && r.fields[1].label === "Мобильный" && !r.fields.some((f: any) => f.code === "status")
      && r.fields[6].code === "comment" && r.fields[6].grid === "0/21/15/3"],
  ["bo_code_set", { code: "mcp_probe_client", newCode: "mcp_probe_customer" }, (r) => r.was === "mcp_probe_client" && r.code === "mcp_probe_customer"],
  ["bo_code_set", { code: "mcp_probe_customer", fieldId: "@bo_create.fields.0.fieldId", newCode: "title" }, (r) => r.was === "name" && r.code === "title"],
  ["bo_create", { group: "Бизнес-объект", name: "MCP probe dup", code: "mcp_probe_customer" }, (r) => /taken/.test(r)],
  ["co_build", { group: "Бизнес-объект", name: "MCP probe composite", code: "mcp_probe_co", attrs: [
    { links: [{ bo: "MCP probe client", field: "Наименование" }] },
    { label: "Контакт", code: "contact", links: [{ bo: "@bo_create.id", field: "Мобильный" }, { bo: "@bo_create.id", field: "E-mail" }] }] },
    (r) => r.code === "mcp_probe_co" && r.simple.length === 1 && r.simple[0].label === "Наименование" && r.composite.length === 1
      && r.composite[0].label === "Контакт" && r.composite[0].code === "contact" && r.composite[0].links === 2 && r.sources.length === 1],
  ["co_build", { coId: "@co_build.coId", attrs: [{ links: [{ bo: "@bo_create.id", field: "Нет такого" }] }] }, (r) => /not a field.*draft was removed/.test(r)],
  ["stand_read", { path: "v2/co/load-mock-open-drafts" }, (r) => r === 0],
  // records: a client record (its form save hits the ES breaker once and is found stored), a BO with every kind of value
  // referencing it; option codes kept on create and changed by edit; both cycles, a veto, find, read, the soft delete
  ["record_save", { code: "mcp_probe_customer", values: { title: "ES breaker client", "Мобильный": "+7 700" } },
    (r) => r.saved === true && r.created && /ES error/.test(r.note) && r.record.title === "ES breaker client" && r.record.phone === "+7 700"],
  ["bo_create", { group: "Бизнес-объект", name: "MCP probe records", code: "mcp_probe_records", window: false, fields: [
    { label: "Название", type: "INPUT_TEXT", code: "title", required: true },
    { label: "Статус", type: "DROPDOWN_SINGLE", code: "status", options: [{ label: "Новый", code: "new" }, { label: "В работе", code: "in_work" }, "Закрыт"] },
    { label: "Готово", type: "CHECKBOX", code: "done" }, { label: "Срок", type: "DATE", code: "due" },
    { label: "Клиент", type: "BO", code: "client", refBoId: "@bo_create.id" }, { label: "Описание", type: "TEXTAREA", code: "descr", tab: "Детали" }] },
    (r) => r.code === "mcp_probe_records" && !r.notes?.some((n: string) => /option codes not kept/.test(n))],
  ["bo_read", { code: "mcp_probe_records", raw: true }, (r) => r.formFields[1].options.map((o: any) => o.code).join() === "new,in_work,Gen_2"],
  ["bo_fields_save", { code: "mcp_probe_records", edit: [{ fieldId: "@bo_read.formFields.1.fieldId", optionCodes: { "В работе": "working", "Gen_2": "closed" } }] }, (r) => r.fields.length >= 7],
  ["bo_read", { code: "mcp_probe_records", raw: true }, (r) => r.formFields[1].options.map((o: any) => o.code).join() === "new,working,closed"],
  ["record_save", { code: "mcp_probe_records", values: { title: "Первая", status: "В работе", done: true, due: "2026-10-17", client: "@record_save.id", "Описание": "Текст" } },
    (r) => r.saved === true && r.record.status.display === "В работе" && r.record.done.value === "true" && r.record.due === "\"2026-10-17T00:00:00.000Z\""
      && /^\["BOI\w+"\]$/.test(r.record.client) && r.record.descr === "Текст"],
  ["record_save", { code: "mcp_probe_records", values: { title: "Нет", status: "Новый" }, scripts: false }, (r) => /DROPDOWN_SINGLE/.test(r)],
  ["record_save", { code: "mcp_probe_records", values: { title: "Вторая", done: false }, scripts: false }, (r) => r.saved === true && /draft/.test(r.cycle) && r.record.title === "Вторая"],
  ["record_save", { code: "mcp_probe_records", values: { done: true } }, (r) => r.saved === false && r.errors[0].field === "title"],
  ["records_find", { code: "mcp_probe_records" }, (r) => r.total === 2 && r.records[0].values.title === "Вторая" && r.columns.includes("Название")],
  ["record_save", { code: "mcp_probe_records", id: "@records_find.records.0.id", values: { status: "working" } }, (r) => r.saved === true && !r.created && r.record.status.display === "В работе"],
  ["records_find", { code: "mcp_probe_records", where: { "Название": "первая" } }, (r) => r.records.length === 1 && r.records[0].values.title === "Первая"],
  ["records_find", { code: "mcp_probe_records", where: { descr: "Текст" } }, (r) => /not a registry column/.test(r)],
  ["record_read", { code: "mcp_probe_records", id: "@records_find.records.0.id" }, (r) => r.state === "ALL" && r.values.title === "Первая" && r.values.descr === "Текст"],
  ["record_delete", { code: "mcp_probe_records", ids: ["@records_find.records.0.id"] }, (r) => r.records[0].values.title === "Первая" && !r.deleted],
  ["record_delete", { code: "mcp_probe_records", ids: ["@records_find.records.0.id"], confirm: true }, (r) => r.deleted[0].state === "REMOVED" && !r.warning],
  ["records_find", { code: "mcp_probe_records" }, (r) => r.total === 1],
  // records through xlsx: a BO with a unique code, a dropdown, a checkbox, a date and a TABLE block of clients; the template,
  // a plain block value with no key refused, an act (2 new, 1 failing) cancelled, again and applied, the export, an update by path
  ["bo_find", { code: "mcp_probe_customer" }, (r) => r.exists === true],
  ["bo_create", { group: "Бизнес-объект", name: "MCP probe xlsx", code: "mcp_probe_xlsx", window: false, fields: [
    { label: "Код", type: "INPUT_TEXT", code: "code", unique: true }, { label: "Статус", type: "DROPDOWN_SINGLE", code: "status", options: ["Новый", "В работе"] },
    { label: "Готово", type: "CHECKBOX", code: "done" }, { label: "Срок", type: "DATE", code: "due" },
    { label: "Клиенты", type: "BO", code: "clients", refBoId: "@bo_find.id" }] }, (r) => r.code === "mcp_probe_xlsx"],
  ["xlsx_template", { code: "mcp_probe_xlsx", out: "dist/mcp-test/xlsx" },
    (r) => r.headerRows === 2 && r.columns.length === 5 && r.columns[4].field === "clients" && r.columns[4].sub === "Наименование" && r.key[0] === "code"],
