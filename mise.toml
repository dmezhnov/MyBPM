[tasks.eval-crm]
description = "Run N local Haiku evals of MYBPM-IMPORTS.md (a git ref or the working copy) on a CRM concept PDF, in parallel; each run sees only the two files, traces + results land in tools/out/eval-crm/<label>-<i>/ (score them with tools/score-eval-crm.bun.ts)"
usage = '''
arg "<ref>" help="Doc version: a git ref such as v1.4.93, or 'current' for the working copy"
arg "<n>" help="Number of parallel runs"
flag "--pdf <pdf>" help="CRM concept PDF" default="~/Downloads/crm/CRM-автосервис.pdf"
flag "--model <model>" help="Model id (Haiku 4.5 is dropped: it never runs the doc lint)" default="claude-haiku-5-5"
flag "--effort <effort>" help="off (thinking disabled) or a claude --effort level: low, medium, high" default="off"
'''
shell = "bun -e"
run = '''
import { $ } from "bun";
const ref = Bun.env.usage_ref ?? "", n = Number(Bun.env.usage_n), model = Bun.env.usage_model!, effort = Bun.env.usage_effort ?? "off";
const pdf = Bun.env.usage_pdf!.replace(/^~/, Bun.env.HOME!);
if (!ref || !(n > 0)) { console.error("usage: mise run eval-crm <ref|current> <n>"); process.exit(1); }
const doc = ref === "current" ? await Bun.file("MYBPM-IMPORTS.md").text() : await $`git show ${ref}:MYBPM-IMPORTS.md`.text();
const pdfName = pdf.split("/").pop()!;
const prompt = "Создай архив для импорта. Нужно реализовать данный CRM. Буду импортировать на пустой стенд (Новая Компания)\n\n" +
  `Приложены файлы (в текущей папке): MYBPM-IMPORTS.md, ${pdfName}`;
// A run that stops on questions (0.2a) gets ONE fixed answer, the same for every run, as a user would give it.
const answer = "Стенд пустой (Новая Компания), группу создай новую, коды выбери сам. id Person не знаю. Собери всё, что можно.";
// The run must see nothing but the two files: no CLAUDE.md, memory, skills, plugins (the mybpm plugin carries
// the same docs), hooks, MCP or settings. --bare would do it but accepts only ANTHROPIC_API_KEY, not OAuth.
const env: Record<string, string> = {};
for (const [k, v] of Object.entries(Bun.env)) if (!/^(CLAUDE|LLMTRIM|AI_AGENT)/.test(k) && v !== undefined) env[k] = v;
Object.assign(env, {
  CLAUDE_CODE_DISABLE_CLAUDE_MDS: "1", CLAUDE_CODE_DISABLE_AUTO_MEMORY: "1", CLAUDE_CODE_DISABLE_BUNDLED_SKILLS: "1",
  CLAUDE_CODE_DISABLE_CLAUDE_API_SKILL: "1", CLAUDE_CODE_DISABLE_CLAUDE_CODE_SKILL: "1", CLAUDE_CODE_DISABLE_POLICY_SKILLS: "1",
  CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1",
});
// effort off = thinking disabled; any other level goes to claude --effort with thinking left on
if (effort === "off") Object.assign(env, { CLAUDE_CODE_DISABLE_THINKING: "1", MAX_THINKING_TOKENS: "0" });
const flags = ["--model", model, "--setting-sources", "", "--strict-mcp-config", "--tools", "Read,Write,Bash",
  "--permission-mode", "bypassPermissions", "--output-format", "stream-json", "--verbose", ...(effort === "off" ? [] : ["--effort", effort])];
const label = (ref === "current" ? "current" : ref.replace(/^v/, "")) + "-" + model.replace(/^claude-/, "") + "-" + effort + "-" + new Date().toISOString().slice(5, 16).replace(/[-:T]/g, "");
const runs = Array.from({ length: n }, async (_, i) => {
  // Work outside the repo so neither its git status nor any parent CLAUDE.md reaches the run.
  const work = `${Bun.env.TMPDIR ?? "/tmp"}/mybpm-eval/${label}-${i + 1}`;
  const out = `${process.cwd()}/tools/out/eval-crm/${label}-${i + 1}`; // absolute: stdout files open relative to the child cwd
  await $`rm -rf ${work} && mkdir -p ${work} ${out}`;
  await Bun.write(`${work}/MYBPM-IMPORTS.md`, doc);
  await $`cp ${pdf} ${work}/${pdfName}`;
  const t0 = Date.now();
  console.log(`${out}: started`);
  // bwrap: a private /tmp per run, so runs that build in /tmp/<something> cannot collide; every run sees /tmp/run.
  const turn = (args: string[], trace: string) => Bun.spawn(["bwrap", "--dev-bind", "/", "/", "--tmpfs", "/tmp",
    "--bind", work, "/tmp/run", "--chdir", "/tmp/run", "claude", "-p", ...args, ...flags],
    { env, stdin: "ignore", stdout: Bun.file(`${out}/${trace}.jsonl`), stderr: Bun.file(`${out}/${trace}.stderr.txt`) }).exited;
  let code = await turn([prompt], "trace");
  if (code === 0 && !(await $`find ${work} -name "*.mybpm.zip"`.text()).trim()) {
    const session = JSON.parse((await Bun.file(`${out}/trace.jsonl`).text()).split("\n")[0]).session_id;
    console.log(`${out}: no archive after turn 1, answering`);
    code = await turn([answer, "--resume", session], "trace2");
  }
  await $`rm ${work}/MYBPM-IMPORTS.md ${work}/${pdfName} && cp -r ${work}/. ${out}/files/`.nothrow();
  console.log(`${out}: exit ${code}, ${Math.round((Date.now() - t0) / 1000)} s`);
});
await Promise.all(runs);
'''

[tasks.eval-bp-explain]
description = "Run N local Haiku three-turn dialogues «what does this process do» on a process export: T1 explain + where Excel is read, T2 a figure described by arrows that do not match, T3 a copy-buffer fragment of ANOTHER process; answers land in tools/out/eval-bp-explain/<label>-<i>/answers.md (read them by hand)"
usage = '''
arg "<ref>" help="Doc version: a git ref such as v1.4.100, or 'current' for the working copy"
arg "<n>" help="Number of parallel runs"
flag "--zip <zip>" help="Process export .mybpm.zip" required=#true
flag "--fragment <fragment>" help="Block IDE copy-buffer JSON taken from a DIFFERENT process" required=#true
flag "--model <model>" help="Model id (Haiku 4.5 is dropped)" default="claude-haiku-5-5"
'''
shell = "bun -e"
run = '''
import { $ } from "bun";
const ref = Bun.env.usage_ref ?? "", n = Number(Bun.env.usage_n), model = Bun.env.usage_model!;
const zip = Bun.env.usage_zip!.replace(/^~/, Bun.env.HOME!), fragment = Bun.env.usage_fragment!.replace(/^~/, Bun.env.HOME!);
if (!ref || !(n > 0)) { console.error("usage: mise run eval-bp-explain <ref|current> <n> --zip … --fragment …"); process.exit(1); }
const doc = ref === "current" ? await Bun.file("MYBPM-IMPORTS.md").text() : await $`git show ${ref}:MYBPM-IMPORTS.md`.text();
// Same three turns for every run; T2 describes the step BEFORE/AFTER the one with the Excel read, T3 hands a foreign fragment.
const turns = [
  "Что делает этот бизнес-процесс? В каком шаге читается Excel и как мне найти этот шаг на схеме?\n\n" +
    "Приложены файлы (в текущей папке): MYBPM-IMPORTS.md, process.mybpm.zip",
  "Я нашёл фигуру: у неё входящая стрелка «Оповещение пользователя», а исходящая без подписи. Это тот шаг, где читается Excel?",
  "Я скопировал из Block IDE скрипт этого шага, он в файле fragment.json в текущей папке. Посмотри — получается, ты ошибся?",
];
const env: Record<string, string> = {};
for (const [k, v] of Object.entries(Bun.env)) if (!/^(CLAUDE|LLMTRIM|AI_AGENT)/.test(k) && v !== undefined) env[k] = v;
Object.assign(env, {
  CLAUDE_CODE_DISABLE_CLAUDE_MDS: "1", CLAUDE_CODE_DISABLE_AUTO_MEMORY: "1", CLAUDE_CODE_DISABLE_BUNDLED_SKILLS: "1",
  CLAUDE_CODE_DISABLE_CLAUDE_API_SKILL: "1", CLAUDE_CODE_DISABLE_CLAUDE_CODE_SKILL: "1", CLAUDE_CODE_DISABLE_POLICY_SKILLS: "1",
  CLAUDE_CODE_DISABLE_THINKING: "1", MAX_THINKING_TOKENS: "0", CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1",
});
const flags = ["--model", model, "--setting-sources", "", "--strict-mcp-config", "--tools", "Read,Write,Bash",
  "--permission-mode", "bypassPermissions", "--output-format", "stream-json", "--verbose"];
const label = (ref === "current" ? "current" : ref.replace(/^v/, "")) + "-" + new Date().toISOString().slice(5, 16).replace(/[-:T]/g, "");
const runs = Array.from({ length: n }, async (_, i) => {
  const work = `${Bun.env.TMPDIR ?? "/tmp"}/mybpm-eval-bp/${label}-${i + 1}`;
  const out = `${process.cwd()}/tools/out/eval-bp-explain/${label}-${i + 1}`;
  await $`rm -rf ${work} && mkdir -p ${work} ${out}`;
  await Bun.write(`${work}/MYBPM-IMPORTS.md`, doc);
  await $`cp ${zip} ${work}/process.mybpm.zip`;
  const t0 = Date.now();
  let session = "", md = "";
  for (const [t, text] of turns.entries()) {
    // The fragment appears only for the turn that mentions it.
    if (t === 2) await $`cp ${fragment} ${work}/fragment.json`;
    const trace = `${out}/trace${t + 1}.jsonl`;
    const code = await Bun.spawn(["bwrap", "--dev-bind", "/", "/", "--tmpfs", "/tmp", "--bind", work, "/tmp/run",
      "--chdir", "/tmp/run", "claude", "-p", text, ...(session ? ["--resume", session] : []), ...flags],
      { env, stdin: "ignore", stdout: Bun.file(trace), stderr: Bun.file(`${out}/trace${t + 1}.stderr.txt`) }).exited;
    const lines = (await Bun.file(trace).text()).split("\n").filter(Boolean).map(l => JSON.parse(l));
    session ||= lines[0]?.session_id ?? "";
    const result = lines.findLast(l => l.type === "result")?.result ?? `(exit ${code}, no result)`;
    md += `## T${t + 1}: ${text.split("\n")[0]}\n\n${result}\n\n`;
    if (code !== 0) break;
  }
  await Bun.write(`${out}/answers.md`, md);
  console.log(`${out}: done, ${Math.round((Date.now() - t0) / 1000)} s`);
});
await Promise.all(runs);
'''

[tasks.stand-login]
description = "Log in to a stand headlessly (password asked at a hidden prompt, never an argument) and save the token to ~/.config/mybpm/tokens/<host>/<login>.token (mode 600); prints who logged in, never the token"
usage = '''
arg "<host>" help="Stand host, e.g. core2.mybpm.kz (https:// and a trailing / are stripped)"
arg "<login>" help="The user's login (e-mail)"
'''
raw = true
shell = "bun -e"
run = '''
// node:fs only for chmod — Bun has no API to set file permissions.
import { chmodSync } from "node:fs";
const host = Bun.env.usage_host!.replace(/^https?:\/\//, "").replace(/\/+$/, ""), login = Bun.env.usage_login!;
const b64 = (s: string) => Buffer.from(s, "utf8").toString("base64");
process.stdout.write(`Пароль ${login} @ ${host}: `);
Bun.spawnSync(["stty", "-echo"], { stdin: "inherit" });
let password = "";
try { for await (const line of console) { password = line; break; } }
finally { Bun.spawnSync(["stty", "echo"], { stdin: "inherit" }); process.stdout.write("\n"); }
if (!password) { console.error("пустой пароль"); process.exit(1); }
const r = await fetch(`https://${host}/web/v2/auth/v3/login`, { method: "POST", headers: { "Content-Type": "application/json" },
  body: JSON.stringify({ useParamsFromBody: true, params_Lr1oSgwPR8: null, body_o1nhHUG480: {
    "dXNlcm5hbWU=": b64(login), "cGFzc3dvcmQ=": b64(password), timeOffsetZoneInMinutes: -300,
    timezoneRegion: "Asia/Almaty", clientType: "WEB", userAgent: "mise stand-login", pushToken: null, clientVersion: "" } }) });
const body = await r.json().catch(() => null);
if (typeof body !== "string") { console.error("вход не удался:", body?.errorType ?? r.status, body?.message ?? ""); process.exit(1); }
const info = await fetch(`https://${host}/web/v2/auth/load-auth-info`, { headers: { token: body } }).then((x) => x.json());
const path = `${Bun.env.HOME}/.config/mybpm/tokens/${host}/${login}.token`;
await Bun.write(path, body);
chmodSync(path, 0o600);
console.log(`токен сохранён: ${path}`);
console.log(`вошёл: ${info.fio ?? "?"} (${info.email ?? login}), компания ${info.companyCode ?? info.companyId ?? "?"}`);
'''

[tasks.stand-call]
description = "Call a stand /web/ API method with the token saved by stand-login, in the standard envelope; prints the response JSON (auth calls that return a token are refused)"
usage = '''
arg "<host>" help="Stand host, as given to stand-login"
arg "<login>" help="The login whose saved token to use"
arg "<path>" help="Path after /web/, e.g. v2/business-objects/load-bo-groups or import-structure/load-import-state"
flag "--params <json>" help="params_Lr1oSgwPR8 as JSON" default="{}"
flag "--body <json>" help="body_o1nhHUG480 as JSON" default="{}"
flag "--get" help="Send a GET without the envelope (e.g. v2/auth/load-auth-info)"
'''
shell = "bun -e"
run = '''
const host = Bun.env.usage_host!.replace(/^https?:\/\//, "").replace(/\/+$/, ""), login = Bun.env.usage_login!;
const path = Bun.env.usage_path!.replace(/^\/?(web\/)?/, "");
if (/auth\/(v3\/login|load-token|fast-login|otp-login)/.test(path)) { console.error("этот вызов возвращает токен — не через stand-call"); process.exit(1); }
const file = Bun.file(`${Bun.env.HOME}/.config/mybpm/tokens/${host}/${login}.token`);
if (!(await file.exists())) { console.error(`нет токена — сначала: mise run stand-login ${host} ${login}`); process.exit(1); }
const token = (await file.text()).trim();
const r = Bun.env.usage_get === "true"
