name: Publish

# `mise publish <version> <message>` pushes the release commit to `test`. Here it
# is tested; only a green run fast-forwards `main` to it and cuts the GitHub
# release v<version> with the skill zips. A red run leaves `main` untouched.
on:
    push:
        branches:
            - test

permissions:
    contents: write

concurrency:
    group: publish
    cancel-in-progress: false

jobs:
    publish:
        name: Test, fast-forward main, release
        runs-on: ubuntu-latest
        steps:
            # Pushing through the deploy key, not GITHUB_TOKEN: GitHub refuses a
            # GITHUB_TOKEN push that brings changes to .github/workflows/.
            - name: Checkout test branch
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  ref: test
                  ssh-key: ${{ secrets.RELEASE_SSH_KEY }}

            - name: Resolve version
              id: version
              run: |
                  version="$(jq -r '.version // empty' .claude-plugin/plugin.json)"
                  [ -n "$version" ] || { echo "::error::.claude-plugin/plugin.json has no version"; exit 1; }
                  echo "version=${version}" >> "$GITHUB_OUTPUT"
                  echo "tag=v${version}" >> "$GITHUB_OUTPUT"

            - name: Ensure release tag is new
              run: |
                  if git ls-remote --exit-code --tags origin "refs/tags/${{ steps.version.outputs.tag }}"; then
                    echo "::error::Tag ${{ steps.version.outputs.tag }} already exists. Bump the version before publishing."
                    exit 1
                  fi

            - name: Install mise
              uses: jdx/mise-action@v5

            - name: Test
              run: mise test

            # Fast-forward only: if main moved on its own, the push is rejected
            # instead of silently dropping those commits.
            - name: Push main and tag
              run: |
                  git remote set-url origin "git@github.com:${GITHUB_REPOSITORY}.git"
                  git push origin HEAD:main
                  git tag "${{ steps.version.outputs.tag }}"
                  git push origin "${{ steps.version.outputs.tag }}"

            - name: Create GitHub release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  gh release create "${{ steps.version.outputs.tag }}" dist/plugin/*.zip dist/skills/*.zip dist/mcp/*.mcpb \
                    --repo "$GITHUB_REPOSITORY" \
                    --title "MyBPM skills ${{ steps.version.outputs.version }}" \
                    --notes "Claude Desktop: Customize → Plugins → Add → Add marketplace dmezhnov/MyBPM, then Discover → + on Mybpm (both skills and the stand MCP server; Desktop runs the server itself, the Chat tab gets the tools; to a newer release: Customize → Plugins → Yours → Mybpm → ⋯ → Check for updates, then press the Update button that becomes active, then restart Desktop for the server's tools). mybpm-plugin.zip: the same plugin as a file for Add → Upload plugin, a fixed version. Skill zips: one skill each with its platform document, for Customize → Skills. mybpm-stand.mcpb: the stand MCP server alone, a fallback without the plugin (open the file, Install). Stand accounts are added on the server's own page, tool stand_accounts."
