name: Missing tool
description: A task needed an action on the stand that no tool of the mybpm-stand MCP server does (on the latest plugin). De-identified — no hosts, companies, people or record data.
title: "MCP: не хватило инструмента — "
labels: ["missing-tool"]
body:
  - type: markdown
    attributes:
      value: |
        One tool per issue; related gaps of one theme may share an issue. A tool that the current plugin already has is not a gap.
        Use placeholders (`<stand>`, `<company-a>`, `<user>`) instead of real hosts, companies, logins and people; keep record data out.
        Search the [existing reports](https://github.com/dmezhnov/MyBPM/issues?q=is%3Aissue+label%3Amissing-tool) first.
  - type: textarea
    id: action
    attributes:
      label: The action needed
      description: What the task had to do on the stand, and why
    validations:
      required: true
  - type: textarea
    id: workaround
    attributes:
      label: How it was done instead
      description: Raw stand_call / HTTP calls (path, body, answer), browser steps, stand version, de-identified
      render: text
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed tool
      description: Name, parameters, what it returns, whether it writes to the stand
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Plugin version
    validations:
      required: true
