name: Plugin bug
description: A tool, lint or script of the plugin broke its own contract (on the latest plugin). De-identified — no hosts, companies, people or record data.
title: "[plugin-bug] "
labels: ["plugin-bug"]
body:
  - type: markdown
    attributes:
      value: |
        One defect per issue. Check first that the call follows the tool's schema.
        Use placeholders (`<stand>`, `<company-a>`, `<user>`) instead of real hosts, companies, logins and people; keep record data out.
        Search the [existing reports](https://github.com/dmezhnov/MyBPM/issues?q=is%3Aissue+label%3Aplugin-bug) first.
  - type: input
    id: tool
    attributes:
      label: Tool
      description: The tool, lint or script that misbehaved
    validations:
      required: true
  - type: textarea
    id: call
    attributes:
      label: The call
      description: Its arguments, de-identified
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What the schema or description promises
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What it did
      description: The exact answer or error text, de-identified
    validations:
      required: true
  - type: textarea
    id: where
    attributes:
      label: Cause in the code
      description: File and line, if found
  - type: input
    id: version
    attributes:
      label: Plugin version
    validations:
      required: true
