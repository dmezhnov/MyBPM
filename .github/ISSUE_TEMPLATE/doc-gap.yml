name: Documentation gap
description: The documents are silent about a platform behaviour, so it had to be found out on a stand (on the latest plugin). De-identified — no hosts, companies, people or record data.
title: "[doc-gap] "
labels: ["doc-gap"]
body:
  - type: markdown
    attributes:
      value: |
        One fact per issue. A fact that the current MYBPM-IMPORTS.md / MYBPM-UI-API.md already state is not a gap.
        Use placeholders (`<stand>`, `<company-a>`, `<user>`) instead of real hosts, companies, logins and people; keep record data out.
        Search the [existing reports](https://github.com/dmezhnov/MyBPM/issues?q=is%3Aissue+label%3Adoc-gap) first.
  - type: dropdown
    id: document
    attributes:
      label: Document
      description: The document the fact belongs in
      options: ["MYBPM-IMPORTS.md", "MYBPM-UI-API.md"]
    validations:
      required: true
  - type: input
    id: heading
    attributes:
      label: Heading
      description: The heading (§, item, trap number) the fact belongs under
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: What the documents do not say
      description: What had to be known for the task
    validations:
      required: true
  - type: textarea
    id: measured
    attributes:
      label: What the stand showed
      description: The calls, answers or UI steps and the stand version, de-identified
      render: text
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed text
      description: Each claim marked [C] (measured) or [I] (inferred)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Plugin version
    validations:
      required: true
